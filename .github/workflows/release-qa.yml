name: Release QA

on:
  push:
    branches:
      - preview/school-site-final
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-branch-validation:
    name: Release branch build and security validation
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.x

      - name: Regenerate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependency tree
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security audit
        run: npm audit --audit-level=low

      - name: Production build
        run: npm run build

      - name: Commit lockfile when dependency manifest changes
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Refresh audited npm lockfile"
            git push origin HEAD:preview/school-site-final
          fi

  pull-request-validation:
    name: Pull request build and security validation
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.x

      - name: Regenerate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependency tree
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security audit
        run: npm audit --audit-level=low

      - name: Production build
        run: npm run build
